[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kvstore"
version = "0.1.0"
description = "A small Redis-compatible in-memory key-value server: asyncio, RESP protocol, key expiry, append-only-file persistence."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
kvstore = "kvstore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
